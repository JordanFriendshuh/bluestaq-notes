services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notes -d notes']
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://notes:notes@db:5432/notes
      PORT: 3000
      # Local demo only; any real deployment sets its own secret.
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me-0123456789}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
